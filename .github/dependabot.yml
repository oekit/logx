version: 2
updates:
  # 全量分组：每周外部+内部依赖合并为一个 PR，
  # 组合兼容性由该 PR 的 CI 一次验证，避免逐包 PR 洪峰（34+ PR 那种）。
  # 嵌套多模块仓：根模块 + 每个嵌套模块各一个 directory 条目。
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      all-deps:
        patterns:
          - "*"
  - package-ecosystem: gomod
    directory: /hlog
    schedule:
      interval: weekly
    groups:
      all-deps:
        patterns:
          - "*"
  - package-ecosystem: gomod
    directory: /hertzlog
    schedule:
      interval: weekly
    groups:
      all-deps:
        patterns:
          - "*"
  - package-ecosystem: gomod
    directory: /kitexlog
    schedule:
      interval: weekly
    groups:
      all-deps:
        patterns:
          - "*"
