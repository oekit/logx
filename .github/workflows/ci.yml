name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  ci:
    name: Lint & Test
    uses: oekit/.github/.github/workflows/go-ci.yml@main
    with:
      go-version: '1.24'
      additional-script: |-
        cd hlog && go build ./... && go test -race -count=1 ./...
        cd ../hertzlog && go build ./... && go test -race -count=1 ./...
        cd ../kitexlog && go build ./... && go test -race -count=1 ./...
